# Render Blueprint: one click creates the database, the API and the website.
# Names below decide the public addresses (https://<name>.onrender.com).
# If Render says a name is taken, rename it here AND in the two URL variables.
databases:
  - name: campus-darpan-db
    plan: free
    databaseName: campus_darpan
    user: campus_darpan

services:
  - type: web
    name: campus-darpan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-darpan-db
          property: connectionString
      - key: AIUB_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false            # you type this in the Render dashboard
      - key: CORS_ORIGINS
        value: https://campus-darpan.onrender.com
      - key: ALLOW_TIME_TRAVEL
        value: "0"
      - key: TRUST_PROXY_HEADERS
        value: "1"

  - type: web
    name: campus-darpan
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE
        value: https://campus-darpan-api.onrender.com
